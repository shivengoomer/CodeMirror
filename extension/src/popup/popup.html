<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./popup.css" />
    <title>CodeMirror Login</title>
  </head>
  <body>
    <main id="app">
      <h1>CodeMirror</h1>
      <p>Login and sync LeetCode cookies to backend.</p>

      <form id="login-form" class="cm-form">
        <input id="login-email" type="email" placeholder="Email" required autocomplete="email" />
        <input id="login-password" type="password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit">Sign In</button>
      </form>

      <button id="btn-logout" type="button">Logout</button>
      <p id="auth-state" hidden></p>
      <p id="login-result" hidden></p>
      <p id="login-error" hidden></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
