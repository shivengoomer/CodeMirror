services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codemirror}
      POSTGRES_USER: ${POSTGRES_USER:-codemirror}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemirror}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codemirror} -d ${POSTGRES_DB:-codemirror}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codemirror:codemirror@postgres:5432/codemirror}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-chrome-extension://your-extension-id}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.workers worker --loglevel=info --concurrency=4 -Q default,sync,analysis,analytics
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codemirror:codemirror@postgres:5432/codemirror}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-chrome-extension://your-extension-id}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.workers beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://codemirror:codemirror@postgres:5432/codemirror}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:-chrome-extension://your-extension-id}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  celery_flower:
    build:
      context: ./backend
    command: celery -A app.workers flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis

  dashboard:
    build:
      context: ./dashboard
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
